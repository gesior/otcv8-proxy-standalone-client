version: '3'

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./build:/app/build
    command: >
      bash -c "mkdir -p /app/build && cp /app/launcher /app/build/launcher && chmod +x /app/build/launcher && echo 'Compilation completed. Binary available at ./build/launcher'"

volumes:
  build:
